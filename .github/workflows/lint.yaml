name: SwiftLint

on: 
  push:
    branches:
      - "**"

jobs:
  swiftlint:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwoftLint
        # run: swiftlint lint
        # 黄色の警告でも許さない場合は、これを追加する 
        # strictをつけると、黄色の警告でもCIが失敗するようになる
        run: swiftlint lint --strict
