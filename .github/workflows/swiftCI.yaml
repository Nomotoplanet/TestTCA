name: Swift CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          pwd
          echo "=== Xcode projects ==="
          find . -name "*.xcodeproj" -print
          echo "=== Workspaces ==="
          find . -name "*.xcworkspace" -print
          echo "=== Top-level files ==="
          ls -la

      - name: Build
        run: |
          xcodebuild \
            -project TestTCA/TestTCA.xcodeproj \
            -scheme TestTCA \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            clean build
